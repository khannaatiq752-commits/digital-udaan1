{% extends "base.html" %}{% block title %}Contact{% endblock %}{% block content %}
<section class="form-page"><span class="eyebrow">LET'S CONNECT</span><h1>Send us a<br><em>message.</em></h1><p>Questions, suggestions or feedback are welcome.</p><form method="post" class="stack-form form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" required minlength="2"></label><label>Email (optional)<input type="email" name="email"></label><label>Message<textarea name="message" required minlength="10" rows="5"></textarea></label><button class="button">Send message ↗</button></form></section>{% endblock %}
